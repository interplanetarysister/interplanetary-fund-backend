name: Issue 16 Lifecycle Verification

on:
  pull_request:
    paths:
      - "convex/campaignLifecycleInternal.ts"
      - "convex/campaigns.ts"
      - "convex/crons.ts"
      - "scripts/verify-issue16-lifecycle.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
      - "agent1/issue-16-lifecycle-implementation-current-main"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/verify-issue16-lifecycle.mjs
      # Convex codegen can require a deployment/configuration. In CI, use the
      # documented local anonymous deployment so codegen validates the exact
      # checked-out source without requiring Production/Development credentials.
      # This is static/local validation only; it is not Development runtime proof.
      - run: npx convex dev --once
